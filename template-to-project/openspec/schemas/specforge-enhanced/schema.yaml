name: specforge-enhanced
version: 2
description: SpecForge 工作流 - Fact-Based and MCP-First + Contract-First 的严谨技术设计

artifacts:
  - id: proposal
    generates: proposal.md
    description: 概述变更的初始提案文档
    template: proposal.md
    instruction: |
      创建 proposal 文档，阐明本次变更的必要性。

      格式要求：
      - **背景**：1-2句话阐述问题或机遇。解决什么问题？为何选择此时？
      - **变更内容**：以项目符号列出变更项。具体说明新增功能、修改项或删除项。重大变更标注**BREAKING**。
      - **功能模块**：明确需创建或修改的规范文件：
        - **新增功能**：列出引入的功能模块。每个模块对应新建 `specs/<name>/spec.md` 文件，采用 kebab-case 命名规范（如 `user-auth`、`data-export`）。
        - **修改功能**：列出需求变更的现有功能。仅当规范层级行为变更（非实现细节变更）时才需列入。每项变更需对应一个增量规范文件。现有规范名称请查阅`openspec/specs/`目录。若无需求变更则留空。
      - **影响范围**：受影响的代码、API、依赖项或系统。

      重要提示：功能模块至关重要。它构成了 proposal 阶段与 specs 阶段之间的契约。填写前请务必研究现有规范。
      此处列出的每项功能都需要对应的规范文件。

      实现细节应归入 design.md。

      此为基础, design 和 tasks 均以此为根基。
    requires: []

  - id: design
    generates: design.md
    description: 基于 Fact-Based and MCP-First 和 Contract-First 的严谨技术设计
    template: design.md
    instruction: |
      创建一个严谨的技术设计文档。

      MUST 遵循 design-generation skill 的执行流程

      何时包含 design.md（仅在适用时创建）：
      - 存在需在编码前通过技术决策消除的模糊性
      - 跨服务变更（涉及多个服务/模块）或新架构模式
      - 新增外部依赖或重大变更
      - 涉及安全性、性能或迁移复杂性

      **核心原则 (IMPORTANT):**
      1.  **Fact-Based and MCP-First**: 设计中的每一个字段、组件引用，必须有 PRD 原文、MCP 查询结果或现有代码作为依据。**严禁幻觉**。
      2.  **Contract-First (BLOCKING)**: 涉及的每一个后端接口，**必须**先调用 `mcp__contract-doc__get_contract_doc`。未获取契约禁止设计。
      3.  **Standards-Compliant (MUST)**: MUST 使用 zx-h5-develop-experience skill 中的开发经验/规范。
      4.  **Task-Tracked (CRITICAL)**: 必须使用 TaskCreate/TaskUpdate/TaskList 工具追踪设计流程的每个步骤。

      **执行步骤 (Execution Flow):**

      **IMPORTANT**: Task 工具追踪是工作流层面的进度管理，本 schema 定义了具体执行步骤。
      执行顺序：
      1. 先创建任务（TaskCreate）
      2. 按 D-1.1 → D-1.2 → ... → D-4 的顺序执行每个任务
      3. 每完成一个任务，更新对应任务状态（TaskUpdate）
      4. 所有任务完成后，调用 TaskList 验证

      ## 阶段识别 (CRITICAL!)

      开始执行前，MUST 先识别当前所处阶段：

      1. **设计生成阶段**: design.md 文件不存在，需要首次生成设计文档
      2. **设计评审阶段**: design.md 文件已存在，需要基于用户反馈进行迭代评审

      根据阶段执行不同的任务追踪策略。

      ## 设计生成阶段 (D-1.1 ~ D-4)

      **MUST 在开始前创建任务列表 (BLOCKING):**

      使用 TaskCreate 工具创建以下 8 个任务。每个任务的参数格式：
      - subject: "D-X: 任务标题"（例如："D-1.1: proposal 需求解析"）
      - description: 详细的任务描述（包含具体步骤）
      - activeForm: 进行时态的动作描述（用于显示在进度条）

      **执行逻辑 (CRITICAL!):**
      先理解需求（知道要做什么），再建立认知基础（知道怎么做），最后验证实现（MCP→源码→对比）

      **任务定义：**

      **Task D-1.1: proposal 需求解析**
      - Subject: "D-1.1: proposal 需求解析"
      - Description: "读取并解析 proposal；提取需求逻辑（建立需求逻辑流程图、业务规则和异常处理表）；识别涉及的后端接口（serviceCode/operationName）；识别需要的 UI 组件和功能；生成技术查询清单"
      - ActiveForm: "正在解析 proposal 需求"

      **Task D-1.2: 技术框架概览**
      - Subject: "D-1.2: 技术框架概览"
      - Description: "使用 querying-infra-catalog skill 的 overview 功能；针对 D-1.1 识别的需求，了解 Xtaro-ZX 组件库和 NFES 框架的相关能力范围；建立技术认知，为后续查询打基础"
      - ActiveForm: "正在了解技术框架"

      **Task D-1.3: H5 开发规范查询 (BLOCKING)**
      - Subject: "D-1.3: H5 开发规范查询"
      - Description: "MUST 调用 zx-h5-develop-experience skill；针对 D-1.1 识别的功能类型（如分享、埋点、请求等），获取业务线的标准开发规范；记录请求规范、分享规范、埋点规范、异常处理规范、登录规范、渐进式渲染规范；作为后续实现的权威参考"
      - ActiveForm: "正在查询 H5 开发规范"

      **Task D-1.4: 代码库最佳实践探索**
      - Subject: "D-1.4: 代码库最佳实践探索"
      - Description: "使用 Glob 和 Grep 工具进行全局代码库探索（必要时参考 ast-grep skill 的指南）；针对 D-1.1 识别的需求，寻找类似功能的实现模式（如其他会员页面）；分析现有文件命名规范、目录组织方式；提取最佳实践作为实现参考"
      - ActiveForm: "正在探索代码库最佳实践"

      **Task D-1.5: 基建能力查询与验证**
      - Subject: "D-1.5: 基建能力查询与验证"
      - Description: "使用 querying-infra-catalog skill 的 search 和 specifications 功能查询 D-1.1 识别的组件/API；针对查询到的基建能力，使用 Read 工具读取相关源码验证实际使用情况；对比 MCP 查询结果与源码实现；若不一致，参考 D-1.3 的开发规范或 D-1.4 的最佳实践；若仍有歧义，标记为待用户确认"
      - ActiveForm: "正在查询基建能力并验证"

      **Task D-2: 后端接口契约查询 (BLOCKING)**
      - Subject: "D-2: 后端接口契约查询"
      - Description: "从 proposal 提取所有 serviceCode 和 operationName；对每个接口调用 mcp__contract-doc__get_contract_doc；使用 Priority Waterfall (L1/L2/L3) 推导字段来源；记录完整入参表和返回值表"
      - ActiveForm: "正在查询后端接口契约"

      **Task D-3: 差距分析与问题生成**
      - Subject: "D-3: 差距分析与问题生成"
      - Description: "对比 proposal 需求与事实（D-1.5 的基建能力、D-2 的契约）；识别 MISSING 项和不一致项；按 L2 静默原则和功能聚类策略生成设计问题；按优先级分类：🔴 临界（缺失关键信息）、🟡 重要（不一致或模糊）、🟢 参考（优化建议）"
      - ActiveForm: "正在分析差距并生成问题"

      **Task D-4: 文档构建与输出**
      - Subject: "D-4: 文档构建与输出"
      - Description: "按模板结构填充 design.md（标题、需求逻辑、外部依赖、代码变更范围、待决策问题、验收标准）；引用 D-1.3 的开发规范作为实现约束；引用 D-1.4 的最佳实践作为实现参考；更新状态为 Round 1 / ⏳ 待用户审查；输出完整的 design.md 文件"
      - ActiveForm: "正在构建设计文档"

      **执行规则:**
      1. 开始执行前，MUST 调用 TaskCreate 创建以上所有 8 个任务
      2. 开始处理某个任务时，MUST 调用 TaskUpdate 将其状态设为 in_progress
      3. 完成某个任务时，MUST 调用 TaskUpdate 将其状态设为 completed
      4. 所有任务完成后，调用 TaskList 确认全部标记为 completed

      **错误处理:**
      - 任务有严格依赖关系：D-1.1 → D-1.2 → D-1.3 → D-1.4 → D-1.5 → D-2 → D-3 → D-4
      - 若某个任务执行失败，MUST 停止后续任务，将当前任务状态保持为 in_progress
      - 在 design.md 中明确标记 MISSING 项，生成问题让用户补充
      - 不要强行继续执行，等待用户提供信息后再重新执行

      **冲突处理 (D-1.5 专用):**
      - 若 MCP 查询结果与源码不一致：
        1. 参考 D-1.3 的开发规范：规范是权威标准
        2. 参考 D-1.4 的最佳实践：现有实现是经验参考
        3. 若规范和实践给出明确指引 → 采纳并记录差异原因
        4. 若仍有歧义 → 标记为 ⚠️ L3，在 D-3 生成问题让用户确认

      ## 设计评审阶段 (R-1 ~ R-5)

      **MUST 在开始前创建任务列表 (BLOCKING):**

      使用 TaskCreate 工具创建以下 5 个任务。每个任务的参数格式：
      - subject: "R-X: 任务标题"（例如："R-1: 读取文件状态"）
      - description: 详细的任务描述（包含具体步骤）
      - activeForm: 进行时态的动作描述（用于显示在进度条）

      **任务定义：**

      **Task R-1: 读取文件状态**
      - Subject: "R-1: 读取文件状态"
      - Description: "读取当前 design.md；解析「📊 当前状态」：轮次、状态；解析各章节的用户确认区（USER_INPUT）；识别本轮新增/修改的用户输入"
      - ActiveForm: "正在读取设计文档状态"

      **Task R-2: MCP 验证与契约理解**
      - Subject: "R-2: MCP 验证与契约理解"
      - Description: "对用户答复中的后端接口参数，重新调用 mcp__contract-doc__get_contract_doc；严格使用 Priority Waterfall 进行判定；对用户确认的基建组件，调用 specifications 验证参数和能力；识别新的 L3 字段或缺失项"
      - ActiveForm: "正在验证 MCP 查询结果"

      **Task R-3: 生成系统建议**
      - Subject: "R-3: 生成系统建议"
      - Description: "在 SYSTEM_SUGGESTION 区域写入建议；根据验证结果分类：✅ 合理、⚠️ 不完整、❌ 冲突；禁止修改 USER_INPUT 区间内的用户内容"
      - ActiveForm: "正在生成系统建议"

      **Task R-4: 检查完成度**
      - Subject: "R-4: 检查完成度"
      - Description: "检查 3 个核心章节是否已确认；检查待决策问题是否已解决（🔴/🟡 必须解决，🟢 可跳过）；检查外部依赖是否齐备（无 ❌ MISSING，⚠️ L3 有用户答复）；判断是否满足完成条件"
      - ActiveForm: "正在检查设计完成度"

      **Task R-5: 更新状态或消化内容**
      - Subject: "R-5: 更新状态或消化内容"
      - Description: "若未完成：更新状态为 Round N+1 / ⏳ 待用户审查，追加审查历史；若已完成：执行 R-4.5 消化（固化用户确认，清理临时区块），更新状态为 ✅ 设计完成"
      - ActiveForm: "正在更新设计文档状态"

      **执行规则:**
      1. 开始评审前，先使用 TaskList 检查是否存在上一轮的评审任务
      2. 若存在，将上一轮所有任务的状态设为 deleted（避免混淆）
      3. 调用 TaskCreate 创建本轮的 R-1~R-5 任务
      4. 开始处理某个任务时，MUST 调用 TaskUpdate 将其状态设为 in_progress
      5. 完成某个任务时，MUST 调用 TaskUpdate 将其状态设为 completed
      6. 所有任务完成后，调用 TaskList 确认全部标记为 completed

      ## 详细执行内容

      1. 事实收集 (CRITICAL!):
          *   **后端契约**: 对 PRD 中提及的每个 ServiceCode/OperationName 调用 `mcp__contract-doc__get_contract_doc`。
              *   *判定规则*: 使用 **Priority Waterfall** (L1 Explicit > L2 Pattern > L3 Ambiguous) 推导字段用途。
          *   **基础设施**: MUST 使用 querying-infra-catalog skill。
              *   *流程*: `overview` (建立认知) -> `search` (探索) -> `specifications` (精查)。
              *   *原则*: 查不到就标记为 **MISSING**，严禁编造组件属性。
          *.  **静态分析**: MUST 使用 ast-grep skill 来完成项目的全景扫描或结构化定位。

      2. 文档编写:
          *   **需求逻辑**: 必须包含需求逻辑流程图。
          *   **外部依赖**: 如实填写 MCP 查询到的契约（入参/出参）和组件规格。
          *   **代码变更范围**: 了解项目结构，明确影响范围。

    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 基于架构师思维的任务规划
    template: tasks.md
    instruction: |
      使用架构师思维生成任务列表。

      MUST 使用 task-planning skill 进行任务规划。

      **架构师思维 (IMPORTANT):**
      1.  **前置检查**: 确认 `design.md` 中的"外部依赖"已齐备（无 MISSING 标记）。
      2.  **任务边界划分 (Context-Closed)**:
          - 每个任务必须是**完整的工作单元**（例如："实现登录页 UI +逻辑"），任务规模应控制在单次 session 内完成。
          - **禁止**生成"测试"任务（如果用户明确要求需要测试，测试包含在具体开发任务中）。
      
      **IMPORTANT**: 请严格遵循下方模板格式，apply 阶段将解析。
      复选框格式以追踪进度，未使用`- [ ]`的任务将无法被追踪。

      规范要求：
      - 相关任务需归类至 ## 编号标题下
      - 每个任务必须采用复选框格式：`- [ ] X.Y 任务描述`
      - 按依赖关系排序任务（哪些必须优先完成？）

      示例：
      ```
      ## 1. 环境搭建

      - [ ] 1.1 创建新模块结构

      ## 2. 核心实现

      - [ ] 2.1 实现数据导出功能
      - [ ] 2.2 添加CSV格式化工具
      ```

      深入理解 design.md 中的技术实现方案。每个任务应可验证——完成时可明确知晓。
    requires:
      - design

apply:
  requires: [tasks, design]
  tracks: tasks.md
  instruction: |
    动手前先阅读 `design.md` 中的技术设计，逐个实现任务，完成一项标记一项。

    MUST 使用以下 skills 辅助实现：
    - zx-h5-develop-experience skill: H5 开发规范
    - querying-infra-catalog skill: 查询组件/API 规格

    **实现原则:**
    - **Strict Mode**: 如果发现代码中需要调用的 API 在 `design.md` 中缺失或不匹配，**必须暂停**并重新调研（调用 MCP），严禁盲目编码。
    - **Verify**: 阅读上下文文件，按待办任务推进，完成即标记，所以任务完成之后，调用 quality-gate-agent 来审查代码实施是否符合设计。
