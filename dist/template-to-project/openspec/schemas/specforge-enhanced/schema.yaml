      **Task D-5-3: 流程图迭代与问题检测 (CRITICAL!)**
      - Subject: "D-5-3: 流程图迭代与问题检测"
      - Description: "若用户提出修改意见：更新流程图，**SHOULD重新调用 mermaid-mcp 验证**（若MCP服务可用则验证，若不可用则标注未验证警告）；**复盘检查（仅检查🔴级别）**：流程图修改是否引入新的技术问题或歧义；🔴级别问题：(1)新增接口调用，但未通过MCP查询契约，(2)新增组件使用，但未通过MCP查询规格，(3)新增异常分支，但处理方式与开发规范冲突，(4)数据流向变化导致关键字段来源不明；【回退处理】若引入🔴级别问题：按照「任务追踪系统规则」中的回退清理逻辑，删除阶段三的任务（D-5-1~D-5-3，调用TaskUpdate设为deleted），回到阶段二 D-4-1 讨论新问题（迭代计数器继续累加，不重置）；若无🔴级别问题但需要修改流程图：回到 D-5-1 重新生成；若用户确认流程图且无🔴级别问题：进入阶段四"
      - ActiveForm: "正在处理流程图反馈"

      **执行规则（阶段三）:**
      1. 调用 TaskCreate 创建 D-5-1~D-5-3 任务
      2. **循环执行 D-5-1 → D-5-2 → D-5-3**：
         - 若 D-5-3 发现新问题 → 回到阶段二 D-4-1
         - 若 D-5-3 需要修改流程图 → 回到 D-5-1
         - 若用户确认流程图且无新问题 → 进入阶段四
      3. 所有任务完成后，调用 TaskList 确认全部标记为 completed

      **技术流程图质量要求（D-5-1 专用）:**
      - 在 proposal.md 业务流程图基础上补充技术细节
      - 必须标注：接口名（serviceCode/operationName）、组件名、关键字段、数据流向、异常处理
      - 使用 subgraph 分区：前端模块、后端接口、基建组件等
      - 包含所有主流程、分支流程、异常流程
      - **MUST 调用 mermaid-mcp 验证语法**，确保可正常渲染
      - 严格校验数据流转逻辑（参数从哪里来、如何传递、如何转换）

      ---

      ### 阶段四：文档生成与交付（内部）

      **MUST 在开始前创建任务列表 (BLOCKING):**
      使用 TaskCreate 工具创建以下 3 个任务。

      **任务定义：**

      **Task D-6-1: 生成完整 design.md**
      - Subject: "D-6-1: 生成完整 design.md"
      - Description: "【执行指令】(1)整合内容：基于阶段一/二/三的所有输出，生成完整的design.md，包含：技术实现流程图（已确认，含所有技术细节）、外部依赖与接口（契约入参/返回值、基建组件规格，标注事实来源）、代码变更范围（基于D-1-4最佳实践）、验收标准（通用+TDD模式）、变更日志；(2)清理待决策问题章节：MUST完全删除「待决策问题」章节（包括标题和所有内容），所有已解决的问题融入对应章节；(3)验证：检查文档中不应包含任何待决策问题的痕迹、USER_INPUT标记、SYSTEM_SUGGESTION标记、[MISSING]标记、⚠️L3未解决项；(4)输出：这是纯技术方案文档，禁止再次询问用户"
      - ActiveForm: "正在生成完整设计文档"

      **Task D-6-2: 格式与内容质量审查**
      - Subject: "D-6-2: 格式与内容质量审查"
      - Description: "调用 format-compliance-agent，传入 design.md 的模板路径和当前 change 的 design.md 文档路径。format-compliance-agent 将执行：(1) 结构审查：检查章节顺序、层级、完整性；(2) Mermaid 流程图验证：调用 mermaid-mcp 检查语法、渲染正确性和技术细节完整性（接口名、组件名、字段、数据流向）；(3) 内容遗漏扫描：扫描 MISSING/⚠️/❌ 标记（此时应无遗漏项）；(4) 逻辑闭环检查：检查接口/组件描述的完整性、事实依据是否为空；(5) 事实来源验证：确认所有外部依赖都标注了事实来源（[MCP:契约]/[MCP:基建]/[Skill]/[代码库]）"
      - ActiveForm: "正在审查设计文档格式与内容质量"

      **Task D-6-3: 用户最终确认**
      - Subject: "D-6-3: 用户最终确认"
      - Description: "展示完整的 design.md 文档；说明文档包含的所有技术设计内容和已确认的决策；等待用户最终确认；若用户提出修改意见，评估是否需要回到相应阶段重新执行；若用户确认，标记 design 为✅完成"
      - ActiveForm: "等待用户最终确认"

      **执行规则（阶段四）:**
      1. 触发条件：技术流程图已确认且所有问题已解决
      2. 调用 TaskCreate 创建 D-6-1~D-6-3 任务
      3. 按顺序执行任务，D-6-2 MUST 使用 Task 工具启动 subagent（model: fast）
      4. 所有任务完成后，调用 TaskList 确认全部标记为 completed

      ## 文档格式要求
      - 技术实现流程图（包含所有技术细节：接口名、组件名、字段、数据流向、异常处理）
      - 外部依赖与接口（契约入参/返回值、基建组件规格，所有信息标注事实来源）
      - 代码变更范围（基于最佳实践确定）
      - 验收标准（通用标准 + TDD 模式标准）
      - 变更日志（记录每一轮的修改）

      ## 输出前检查
      - 技术实现流程图 MUST 包含所有技术元素（接口名、组件名、关键字段、数据流向、异常处理）
      - 技术实现流程图 MUST 使用 subgraph 对功能模块、前后端、基建组件等进行分区
      - 所有外部依赖 MUST 标注事实来源（[MCP:契约]/[MCP:基建]/[Skill]/[代码库]）
      - 所有接口 MUST 有完整的入参表和返回值表（基于 get_contract_doc 查询结果）
      - 基建组件 MUST 标注能力范围和使用方式
      - 代码变更范围 MUST 明确影响的文件和操作类型（新建/修改/删除）
      - 不应包含"待决策问题"章节（所有问题已需要在阶段二解决）

    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 基于架构师思维的任务规划
    template: tasks.md
    instruction: |
      使用架构师思维生成任务列表。

      MUST 使用 task-planning skill 进行任务规划。

      **架构师思维 (IMPORTANT):**
      1.  **前置检查**: 确认 `design.md` 中的"外部依赖"已齐备（无 MISSING 标记）。
      2.  **任务边界划分 (Context-Closed)**:
          - 每个任务必须是**完整的工作单元**（例如："实现登录页 UI +逻辑"），任务规模应控制在单次 session 内完成。
          - **禁止**生成"测试"任务（如果用户明确要求需要测试，测试包含在具体开发任务中）。

      **IMPORTANT**: 请严格遵循下方模板格式，apply 阶段将解析。
      复选框格式以追踪进度，未使用`- [ ]`的任务将无法被追踪。

      规范要求：
      - 相关任务需归类至 ## 编号标题下
      - 每个任务必须采用复选框格式：`- [ ] X.Y 任务描述`
      - 按依赖关系排序任务（哪些必须优先完成？）

      示例：
      ```
      ## 1. 环境搭建

      - [ ] 1.1 创建新模块结构

      ## 2. 核心实现

      - [ ] 2.1 实现数据导出功能
      - [ ] 2.2 添加CSV格式化工具
      ```

      深入理解 design.md 中的技术实现方案。每个任务应可验证——完成时可明确知晓。
    requires:
      - design

apply:
  requires: [tasks, design]
  tracks: tasks.md
  instruction: |
    动手前先阅读 `design.md` 中的技术设计，逐个实现任务，完成一项标记一项。

    MUST 使用以下 skills 辅助实现：
    - {{DEVELOP_SKILLS_NAMES}} skill: 开发规范/开发经验
    - querying-infra-catalog skill: 查询组件/API 规格

    **实现原则:**
    - **Strict Mode**: 如果发现代码中需要调用的 API 在 `design.md` 中缺失或不匹配，**必须暂停**并重新调研（调用 MCP），严禁盲目编码。
    - **Verify**: 阅读上下文文件，按待办任务推进，完成即标记，所以任务完成之后，调用quality-gate-agent来审查代码实施是否符合设计。
