name: specforge-enhanced
version: 3
description: SpecForge 工作流 - Fact-Based and MCP-First + Contract-First 的严谨技术设计，迭代式问题讨论与流程图确认

artifacts:
  - id: proposal
    generates: proposal.md
    description: 概述变更的初始提案文档
    template: proposal.md
    instruction: |
      ## 核心目标
      创建结构完整的 proposal 文档，通过迭代式问题讨论和流程图确认实现需求认知对齐。

      ## 背景知识（必读）

      ### 多端架构理解
      - **支持端**：APP、小程序、H5 三种形态
      - **关键约束**：H5 默认内嵌于宿主（APP/小程序）
        - 宿主与 H5 共用登录态
        - 需关注资源位配置、宿主调用等交互边界
        - H5 需思考是否需要登录，登录时跳转到登录页

      ### 任务追踪系统规则（CRITICAL）

      **通用任务管理规则：**
      1. **任务创建**：每个阶段开始前 MUST 调用 TaskCreate 创建该阶段的所有任务
      2. **任务更新**：
         - 开始处理任务时：TaskUpdate 设为 in_progress
         - 完成任务时：TaskUpdate 设为 completed
      3. **任务清理**：
         - **正常完成**：阶段所有任务 completed 后，保留任务记录不删除（供审计追溯）
         - **回退清理**：从阶段三回退到阶段二时，MUST 删除阶段三的所有任务（P-3-1~P-3-3 或 D-5-1~D-5-3）
         - **放弃清理**：用户明确放弃当前需求时，删除所有未完成的任务
      4. **任务查询**：任何阶段开始前，MUST 调用 TaskList 确认当前状态
      5. **失败处理**：任务执行失败时，保持 in_progress 状态，停止后续任务

      **回退时的清理逻辑（MUST）：**
      ```
      若检测到需要从阶段三回退到阶段二：
        1. 调用 TaskList 获取所有任务
        2. 识别阶段三任务（P-3-1/P-3-2/P-3-3 或 D-5-1/D-5-2/D-5-3）
        3. 对每个阶段三任务调用 TaskUpdate，设置 status: deleted
        4. 确认删除完成后，回到阶段二 P-2-1 或 D-4-1
      ```

      ## 执行流程

      ### 阶段一：需求消化（内部）
      **MUST 在开始前创建任务列表 (BLOCKING):**
      使用 TaskCreate 工具创建以下 3 个任务。每个任务的参数格式：
      - subject: "P-1-X: 任务标题"（例如："P-1-1: 需求文档接收"）
      - description: 详细的任务描述（包含具体步骤）
      - activeForm: 进行时态的动作描述

      **任务定义：**

      **Task P-1-1: 需求文档接收与概述**
      - Subject: "P-1-1: 需求文档接收与概述"
      - Description: "接收用户需求文档；生成需求概述；识别业务线、用户角色、核心场景"
      - ActiveForm: "正在接收需求文档"

      **Task P-1-2: 功能逻辑解析**
      - Subject: "P-1-2: 功能逻辑解析"
      - Description: "生成功能逻辑详述（完整功能清单）；严格按需求文档提取所有功能点；使用中文业务术语，禁止代码变量名、API 路径；明确标注各功能的端支持情况（APP / 小程序 / H5）"
      - ActiveForm: "正在解析功能逻辑"

      **Task P-1-3: 问题识别**
      - Subject: "P-1-3: 问题识别"
      - Description: "识别所有逻辑空缺/歧义/盲区；生成初始问题列表（不生成流程图，不生成完整文档）；将问题按优先级分类：🔴 临界、🟡 重要、🟢 参考；检查是否需要询问'是否忽略某些功能模块'"
      - ActiveForm: "正在识别需求问题"

      **执行规则（阶段一）:**
      1. 开始执行前，MUST 调用 TaskCreate 创建以上 3 个任务
      2. 开始处理某个任务时，MUST 调用 TaskUpdate 将其状态设为 in_progress
      3. 完成某个任务时，MUST 调用 TaskUpdate 将其状态设为 completed
      4. 所有任务完成后，调用 TaskList 确认全部标记为 completed
      5. 若某个任务执行失败，MUST 停止后续任务，将当前任务状态保持为 in_progress
      6. **P-1-3 完成后不输出完整文档**：仅生成问题列表，进入阶段二与用户迭代讨论

      ---

      ### 阶段二：问题迭代讨论（与用户交互）

      **MUST 在开始前创建任务列表 (BLOCKING):**
      使用 TaskCreate 工具创建以下 3 个任务。

      **任务定义：**

      **Task P-2-1: 问题展示**
      - Subject: "P-2-1: 问题展示"
      - Description: "【执行指令】(1)检查迭代计数器：本次是第N轮（阶段二+阶段三合计，从阶段三回退到阶段二时计数器继续累加不重置），若N≥5且仍有🔴临界问题，执行步骤(2)，否则跳到步骤(3)；(2)达到5轮上限处理：停止迭代，展示'已完成5轮迭代，仍有X个🔴临界问题未解决'，询问用户选择：[继续5轮/暂停重新梳理需求/忽略问题强制进入下阶段]，等待用户选择，根据选择重置计数器（继续5轮）或进入下阶段（其他选项）；(3)正常展示：将所有待决策问题展示给用户，每个问题提供1-2个备选方案（基于业务常识），标注优先级（🔴/🟡/🟢），等待用户回答；【绝对上限】无论用户如何选择，总迭代次数（包括所有重置后的轮次）不得超过10轮，超过10轮后强制终止流程，生成包含所有未解决问题的 blocker 级别报告，要求用户补充需求文档或手动解决"
      - ActiveForm: "正在展示待决策问题"

      **Task P-2-2: 接收用户答复**
      - Subject: "P-2-2: 接收用户答复"
      - Description: "【执行指令】(1)接收答复：记录用户在问题列表中的每一个选择或自定义输入；(2)完整性检查：确保所有🔴临界问题已得到回答，若有未答复的🔴问题，标记为'待补充'并在下一轮提醒；(3)质量检查：检测模糊答复（如'随便'、'都行'、'看情况'、空答复、仅回复标点符号），对模糊答复生成追问：'该问题涉及[具体影响]，请明确选择：[方案A] 或 [方案B]，或提供具体要求'；(4)记录结果：将明确答复记录到问题列表，将模糊答复标记为'需追问'，在 P-2-3 中处理"
      - ActiveForm: "正在接收用户答复"

      **Task P-2-3: 复盘与新问题检测 (CRITICAL!)**
      - Subject: "P-2-3: 复盘与新问题检测"
      - Description: "**复盘所有已知信息（需求文档 + 功能逻辑 + 用户答复）**；检查用户答复是否引入新的歧义或逻辑漏洞；检查答复之间是否存在冲突或不一致；检查是否有逻辑空缺未被覆盖；**若发现新问题**：生成新的问题条目，回到 P-2-1 继续讨论；**若无新问题**：标记所有问题为已解决，进入阶段三"
      - ActiveForm: "正在复盘并检测新问题"

      **执行规则（阶段二）:**
      1. 开始评审前，先使用 TaskList 检查是否存在上一轮的任务
      2. 若存在，将上一轮任务状态设为 deleted（避免混淆）
      3. 调用 TaskCreate 创建本轮的 P-2-1~P-2-3 任务
      4. **循环执行 P-2-1 → P-2-2 → P-2-3**：
         - 若 P-2-3 发现新问题 → 回到 P-2-1 展示新问题
         - 若 P-2-3 确认无新问题 → 进入阶段三
      5. 所有任务完成后，调用 TaskList 确认全部标记为 completed

      **复盘检查清单（P-2-3 专用）:**

      按严重程度分级判断，仅🔴级别问题触发回退：

      **🔴 必须回退（影响核心逻辑闭环）：**
      - [ ] 用户答复引入新的**核心业务逻辑分支**，但缺少关键信息
        - 示例：用户说"支付成功后发短信"，但短信渠道/内容/触发时机都不明确
        - 非回退：用户说"按钮改成蓝色" - 这只是细化，不是新逻辑分支
      - [ ] 不同问题的答复之间存在**逻辑冲突**，无法同时满足
        - 示例：Q1说"匿名用户可浏览"，Q3说"必须登录才能访问" - 互相矛盾
        - 非回退：Q1说"用Redux"，Q2说"用Context" - 是待决策，不是冲突
      - [ ] **核心功能点**在用户答复后变得完全不明确
        - 示例：原需求是"支付"，用户答复后不确定是"在线支付"还是"线下支付"
        - 非回退：次要功能（如动画效果）描述模糊 - 实现时可自行决定
      - [ ] **登录态相关的核心逻辑**不闭环
        - 示例：未明确"登录失败后跳转到哪里"、"Token存储位置"等关键路径
        - 非回退：登录按钮的样式、文案等细节

      **🟡 建议确认（不影响主流程，可在SYSTEM_SUGGESTION中说明）：**
      - [ ] 用户答复引入新的边界情况或异常流程，但有合理的默认处理方案
        - 示例：用户说"需要处理网络异常" - 可默认显示标准错误提示
      - [ ] 多端支持的答复存在差异，但符合各端技术特性
        - 示例：APP用原生组件，H5用Web组件 - 合理的技术差异
        - 回退示例：APP要求某功能，H5不支持，且是核心功能 - 需重新讨论

      **🟢 记录即可（优化建议，不回退）：**
      - [ ] UI细节、文案、交互动画等表现层问题
      - [ ] 命名规范、代码组织等非功能性建议

      **回退判定规则：**
      - 发现任何🔴级别问题 → MUST 回退到 P-2-1
      - 仅存在🟡级别 → 在 SYSTEM_SUGGESTION 中补充说明，继续进入阶段三
      - 仅存在🟢级别 → 记录在变更日志，继续进入阶段三

      ---

      ### 阶段三：流程图确认（与用户交互）

      **MUST 在开始前创建任务列表 (BLOCKING):**
      使用 TaskCreate 工具创建以下 3 个任务。

      **任务定义：**

      **Task P-3-1: 生成业务逻辑流程图**
      - Subject: "P-3-1: 生成业务逻辑流程图"
      - Description: "基于需求文档、功能逻辑和所有已确认的用户答复；生成完整的 Mermaid 业务逻辑流程图；必须包含：所有主流程、分支流程、异常流程；使用 subgraph 对功能点进行分区；严格校验'登录前、登录中、登录后'的状态切换逻辑；**SHOULD 调用 mermaid-mcp 验证语法**：若 MCP 服务可用则调用验证并修复错误，若不可用则跳过验证并在流程图上方标注'⚠️ 未经 MCP 验证，建议手动检查'；**仅生成流程图，不生成完整文档**"
      - ActiveForm: "正在生成业务逻辑流程图"

      **Task P-3-2: 展示流程图并等待确认**
      - Subject: "P-3-2: 展示流程图并等待确认"
      - Description: "将生成的 Mermaid 流程图展示给用户；说明流程图覆盖的功能点和逻辑分支；等待用户确认或提出修改意见"
      - ActiveForm: "等待用户确认流程图"

      **Task P-3-3: 流程图迭代与问题检测 (CRITICAL!)**
      - Subject: "P-3-3: 流程图迭代与问题检测"
      - Description: "若用户提出修改意见：更新流程图；**复盘检查（仅检查🔴级别）**：流程图修改是否引入新的逻辑问题或歧义；🔴级别问题：(1)流程图修改引入新的核心业务逻辑，但缺少关键信息，(2)流程图与已确认的功能逻辑存在冲突，(3)新增分支的出口/异常处理不明确；【回退处理】若引入🔴级别问题：按照「任务追踪系统规则」中的回退清理逻辑，删除阶段三的任务（P-3-1~P-3-3，调用TaskUpdate设为deleted），回到阶段二 P-2-1 讨论新问题（迭代计数器继续累加，不重置）；若无🔴级别问题但需要修改流程图：回到 P-3-1 重新生成；若用户确认流程图且无🔴级别问题：进入阶段四"
      - ActiveForm: "正在处理流程图反馈"

      **执行规则（阶段三）:**
      1. 调用 TaskCreate 创建 P-3-1~P-3-3 任务
      2. **循环执行 P-3-1 → P-3-2 → P-3-3**：
         - 若 P-3-3 发现新问题 → 回到阶段二 P-2-1
         - 若 P-3-3 需要修改流程图 → 回到 P-3-1
         - 若用户确认流程图且无新问题 → 进入阶段四
      3. 所有任务完成后，调用 TaskList 确认全部标记为 completed

      **流程图质量要求（P-3-1 专用）:**
      - 包含所有主流程、分支流程、异常流程
      - 使用 subgraph 对功能点进行分区
      - 节点使用中文业务术语（不出现代码变量名、API 路径）
      - 严格校验"登录前、登录中、登录后"的状态切换逻辑
      - 包含多端差异处理（如有）

      ---

      ### 阶段四：文档生成与交付（内部）

      **MUST 在开始前创建任务列表 (BLOCKING):**
      使用 TaskCreate 工具创建以下 3 个任务。

      **任务定义：**

      **Task P-4-1: 生成完整 proposal.md**
      - Subject: "P-4-1: 生成完整 proposal.md"
      - Description: "【执行指令】(1)整合内容：基于阶段一/二/三的所有输出，生成完整的proposal.md，包含：需求概述、业务逻辑流程图（已确认）、功能逻辑详述、多端支持说明、需求修改建议、变更日志；(2)清理待决策问题章节：MUST完全删除「待决策问题」章节（包括标题和所有内容），所有已解决的问题融入对应章节；(3)验证：检查文档中不应包含任何待决策问题的痕迹、USER_INPUT标记、SYSTEM_SUGGESTION标记；(4)输出：这是纯解决方案文档，所有问题已在阶段二解决，禁止再次询问用户"
      - ActiveForm: "正在生成完整 proposal 文档"

      **Task P-4-2: 格式与内容质量审查**
      - Subject: "P-4-2: 格式与内容质量审查"
      - Description: "调用 format-compliance-agent，传入 proposal.md 的模板路径和当前 change 的 proposal.md 文档路径。format-compliance-agent 将执行：(1) 结构审查：检查章节顺序、层级、完整性；(2) Mermaid 流程图验证：调用 mermaid-mcp 检查语法和渲染正确性；(3) 内容遗漏扫描：扫描 MISSING/⚠️/❌ 标记（此时应无遗漏项）；(4) 逻辑闭环检查：确保所有功能点都有对应的流程描述"
      - ActiveForm: "正在审查文档格式与内容质量"

      **Task P-4-3: 用户最终确认**
      - Subject: "P-4-3: 用户最终确认"
      - Description: "展示完整的 proposal.md 文档；说明文档包含的所有内容和已确认的决策；等待用户最终确认；若用户提出修改意见，评估是否需要回到相应阶段重新执行；若用户确认，标记 proposal 为✅完成"
      - ActiveForm: "等待用户最终确认"

      **执行规则（阶段四）:**
      1. 触发条件：流程图已确认且所有问题已解决
      2. 调用 TaskCreate 创建 P-4-1~P-4-3 任务
      3. 按顺序执行任务，P-4-2 MUST 使用 Task 工具启动 subagent（model: fast）
      4. 所有任务完成后，调用 TaskList 确认全部标记为 completed

      ---

      ## 文档格式要求
      - 需求概述
      - 业务逻辑流程图
      - 功能逻辑详述
      - 多端支持说明（明确标注各功能的端支持情况）
      - 需求修改建议（用户可补充）
      - 变更日志（记录每一轮的修改）

      ## 输出前检查
      - 业务逻辑流程图 MUST 包含所有已知逻辑节点并使用 subgraph 对功能点进行分区
      - 功能逻辑详述 MUST 包含所有功能点
      - 严禁出现代码变量名、API 路径、数据库字段。使用中文业务术语
      - 严格校验"登录前、登录中、登录后"的状态切换逻辑
      - 文档不应包含"待决策问题"章节（所有问题已在阶段二解决）

    requires: []

  - id: design
    generates: design.md
    description: 基于 Fact-Based and MCP-First 和 Contract-First 的严谨技术设计
    template: design.md
    instruction: |
      创建一个严谨的技术设计文档。

      MUST 遵循 design-generation skill 的执行流程

      何时包含 design.md（仅在适用时创建）：
      - 存在需在编码前通过技术决策消除的模糊性
      - 跨服务变更（涉及多个服务/模块）或新架构模式
      - 新增外部依赖或重大变更
      - 涉及安全性、性能或迁移复杂性

      **核心原则 (IMPORTANT):**
      1.  **Fact-Based and MCP-First**: 设计中的每一个字段、组件引用，必须有 PRD 原文、MCP 查询结果或现有代码作为依据。**严禁幻觉**。
      2.  **Contract-First (BLOCKING)**: 涉及的每一个后端接口，**必须**先调用 `mcp__contract-doc__get_contract_doc`。未获取契约禁止设计。
      3.  **Standards-Compliant (MUST)**: MUST 使用 {{DEVELOP_SKILLS_NAMES}} skill 中的开发经验/规范。
      4.  **Task-Tracked (CRITICAL)**: 必须使用 TaskCreate/TaskUpdate/TaskList 工具追踪设计流程的每个步骤。

      ## 背景知识（必读）

      ### 任务追踪系统规则（CRITICAL）

      **通用任务管理规则：**
      1. **任务创建**：每个阶段开始前 MUST 调用 TaskCreate 创建该阶段的所有任务
      2. **任务更新**：
         - 开始处理任务时：TaskUpdate 设为 in_progress
         - 完成任务时：TaskUpdate 设为 completed
      3. **任务清理**：
         - **正常完成**：阶段所有任务 completed 后，保留任务记录不删除（供审计追溯）
         - **回退清理**：从阶段三回退到阶段二时，MUST 删除阶段三的所有任务（P-3-1~P-3-3 或 D-5-1~D-5-3）
         - **放弃清理**：用户明确放弃当前需求时，删除所有未完成的任务
      4. **任务查询**：任何阶段开始前，MUST 调用 TaskList 确认当前状态
      5. **失败处理**：任务执行失败时，保持 in_progress 状态，停止后续任务

      **回退时的清理逻辑（MUST）：**
      ```
      若检测到需要从阶段三回退到阶段二：
        1. 调用 TaskList 获取所有任务
        2. 识别阶段三任务（P-3-1/P-3-2/P-3-3 或 D-5-1/D-5-2/D-5-3）
        3. 对每个阶段三任务调用 TaskUpdate，设置 status: deleted
        4. 确认删除完成后，回到阶段二 P-2-1 或 D-4-1
      ```

      **执行步骤 (Execution Flow):**

      **IMPORTANT**: Task 工具追踪是工作流层面的进度管理，本 schema 定义了具体执行步骤。
      执行顺序：
      1. 先创建任务（TaskCreate）
      2. 按 D-1.1 → D-1.2 → ... → D-5 的顺序执行每个任务
      3. 每完成一个任务，更新对应任务状态（TaskUpdate）
      4. 所有任务完成后，调用 TaskList 验证

      ## 阶段识别 (CRITICAL!)

      开始执行前，MUST 先识别当前所处阶段：

      1. **设计生成阶段**: design.md 文件不存在 → 执行 D-1.1 ~ D-5
      2. **设计评审阶段**: design.md 文件已存在 → 执行 R-1 ~ R-6

      **评审阶段触发 (BLOCKING!):**
      - 当用户在 design.md 已存在的情况下发送任何消息（补充意见、回答问题、确认内容），MUST 进入评审阶段
      - MUST 先创建 R-1~R-6 任务，再开始分析用户输入
      - 严禁跳过 Task 追踪直接回复用户
      - 用户补充的技术信息（接口名、组件名、参数等）MUST 通过 MCP/Skill 重新验证，严禁直接采信

      ### 阶段一：技术事实收集（内部）

      **MUST 在开始前创建任务列表 (BLOCKING):**

