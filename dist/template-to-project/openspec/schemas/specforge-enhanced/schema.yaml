      **Task D-2: 后端接口契约查询 (BLOCKING)**
      - Subject: "D-2: 后端接口契约查询"
      - Description: "【执行指令】(1)提取接口：从proposal.md提取所有serviceCode和operationName；(2)查询契约：对每个接口调用mcp__contract-doc__get_contract_doc，若调用失败（MCP服务不可用或接口不存在）：标记接口为[MISSING-MCP服务不可用]或[MISSING-接口不存在]，在入参/返回值表中所有字段标记为 ⚠️ L3（来源不明），继续处理其他接口；(3)推导字段：使用Priority Waterfall(L1/L2/L3)推导字段来源；(4)记录：完整记录入参表和返回值表，标记MISSING项和L3不确定项；(5)问题生成准备：将所有标记为 MISSING 的接口信息传递给 D-3，用于生成🔴临界问题"
      - ActiveForm: "正在查询后端接口契约"

      **Task D-3: 差距分析与问题生成**
      - Subject: "D-3: 差距分析与问题生成"
      - Description: "【执行指令】(1)对比分析：对比 proposal 需求与技术事实（D-1-5 的基建能力、D-2 的契约、D-1-4 的最佳实践）；识别 MISSING 项和不一致项；(2)多端约束检测：从 proposal.md「多端支持说明」和「功能逻辑详述」提取端支持要求，检查技术方案的端兼容性，重点检测：①基建组件/API 是否支持所有必需的端，②接口调用是否需要针对不同端做差异化处理，③H5 内嵌场景是否需要特殊处理（登录态、资源位配置、宿主调用等）；(3)性能和安全风险评估：从性能和安全维度评估技术方案，重点检测：①性能风险（大量接口调用、数据量过大、循环嵌套深、未做分页/懒加载），②安全风险（敏感数据未加密、XSS/注入风险、权限校验缺失、日志泄露敏感信息），③资源风险（内存泄漏可能、文件句柄未关闭、并发冲突），若发现高风险项，生成🔴临界问题或🟡重要问题；(4)问题生成：生成技术设计问题并按优先级分类：🔴 临界（缺失关键技术信息、契约缺失、端能力不兼容、高安全风险）、🟡 重要（技术方案不一致或模糊、字段来源不明确、端能力需确认、性能风险）、🟢 参考（技术优化建议）；**问题仅在讨论过程中存在**，不会出现在最终 design.md 文档中；**D-3 完成后不生成文档**，仅生成问题列表，进入阶段二与用户迭代讨论"
      - ActiveForm: "正在分析差距并生成问题"

      **执行规则（阶段一）:**
      1. 开始执行前，MUST 调用 TaskCreate 创建以上所有 7 个任务
      2. 开始处理某个任务时，MUST 调用 TaskUpdate 将其状态设为 in_progress
      3. 完成某个任务时，MUST 调用 TaskUpdate 将其状态设为 completed
      4. 所有任务完成后，调用 TaskList 确认全部标记为 completed
      5. 若某个任务执行失败，MUST 停止后续任务，将当前任务状态保持为 in_progress
      6. **D-3 完成后不输出完整文档**：仅生成问题列表，进入阶段二与用户迭代讨论

      **错误处理:**
      - 任务有严格依赖关系：D-1-1 → D-1-2 → D-1-3 → D-1-4 → D-1-5 → D-2 → D-3
      - 若某个任务执行失败，MUST 停止后续任务，将当前任务状态保持为 in_progress
      - 在问题列表中明确标记 MISSING 项，让用户补充
      - 不要强行继续执行，等待用户提供信息后再重新执行

      **冲突处理 (D-1-5 专用):**
      - 若 MCP 查询结果与源码不一致：
        1. 参考 D-1-2 的开发规范：规范是权威标准
        2. 参考 D-1-4 的最佳实践：现有实现是经验参考
        3. 若规范和实践给出明确指引 → 采纳并记录差异原因
        4. 若仍有歧义 → 标记为待用户确认，在 D-3 生成问题

