      - Subject: "D-1-5: 基建能力查询与验证"
      - Description: "【执行指令】(1)查询基建能力：使用 querying-infra-catalog skill 的 search 和 specifications 功能查询 D-1-1 和 D-1-3 中可能映射的组件/API；(2)多端支持检测：从 proposal.md「多端支持说明」章节提取端支持要求（APP/小程序/H5），对比基建能力的端支持情况，若基建组件/API 不支持某个必需的端，标记为'端能力不兼容'并生成🔴临界问题；(3)源码验证：针对查询到的基建能力，使用 Read 工具读取相关源码验证实际使用情况；(4)对比分析：对比 MCP 查询结果与源码实现，若不一致，参考 D-1-2 的开发规范或 D-1-4 的最佳实践；(5)歧义标记：若仍有歧义或端能力不匹配，标记为待用户确认"
