name: specforge-enhanced
version: 6
description: SpecForge 工作流 - Fact-Based and MCP-First + Contract-First 的严谨技术设计，迭代式问题讨论与文档内流程图生成

artifacts:
  - id: spec
    generates: spec.md
    description: 概述变更的初始需求 Spec 文档
    template: spec.md
    instruction: |
      ## 核心目标
      创建结构完整且人类可读的 spec 文档，通过迭代式问题讨论实现需求认知对齐，并将流程图直接写入文档。

      MUST 使用 spec-process skill 获取完整的阶段执行规则、任务定义和输出规格。

      ## 背景知识

      ### 多端架构理解
      - **支持端**：APP、小程序、H5 三种形态
      - **关键约束**：H5 默认内嵌于宿主（APP/小程序）
        - 宿主与 H5 共用登录态
        - 需关注资源位配置、宿主调用等交互边界
        - H5 需思考是否需要登录，登录时跳转到登录页

      ## 路径识别
      - **生成路径**：spec.md 不存在 → 执行阶段 0~4
      - **评审路径**：spec.md 已存在 → 基于用户反馈进入阶段二或阶段四

      ## 执行流程概览

      ### 阶段0：入口任务预建
      预建固定骨架任务：`P-1-1`、`P-1-1b`、`P-1-2`、`P-1-3`、`P-3-1`、`P-4-1`、`P-4-2`、`P-4-3`

      ### 阶段一：需求消化
      - P-1-1: 需求文档接收与需求摘要提炼
      - P-1-1b: GitNexus Scope 边界划分（双路并行探索）
      - P-1-2: 需求清单解析（Scope 感知）
      - P-1-3: 问题识别
      - **硬门禁**：若存在未解决问题，MUST 禁止进入阶段三与阶段四；MUST 回到阶段二调用 AskUserQuestion 收口

      ### 阶段二：问题迭代讨论（与用户交互）
      按轮次循环执行 P-2-R{n}-1（问题展示）→ P-2-R{n}-2（接收答复）→ P-2-R{n}-3（复盘与新问题检测）
      - **退出条件**：所有🔴/🟡级问题已获明确答案且无新增问题

      ### 阶段三：流程图内部生成
      - P-3-1: 生成并校验 Mermaid 业务逻辑流程图

      ### 阶段四：文档生成与交付
      - P-4-1: 生成完整 spec.md
      - P-4-2: 格式与内容质量审查（format-compliance-agent）
      - P-4-3: 交付通知（`<spec-notification artifact=”spec” .../>` 标签）

    requires: []

  - id: design
    generates: design.md
    description: 基于 Fact-Based and MCP-First 和 Contract-First 的严谨技术设计
    template: design.md
    instruction: |
      创建一个基于 Fact-Based and MCP-First 和 Contract-First 的技术设计文档。

      MUST 使用 design-process skill 获取完整的阶段执行规则、任务定义和输出规格。

      ## 前置要求

      - design artifact 中生成 design.md，禁止跳过
      - **D2C 门禁**：仅当 `D2C_ENABLED: true` 时，才要求先满足：spec 已确认、`D2C_MATERIALS_JSON` 非空、`<!-- D2C_BASELINE_FROZEN: true -->` 存在、`openspec/changes/<change-id>/d2c/manifest.json` 中 `reviewStatus=passed` 且 `canEnterDesign=true`，且 `materials` 内每条记录包含 `artifactId` 并对应存在 D2C 产物文件；同时保留 `openspec/changes/<change-id>/d2c/review.md` 作为人工审查记录；否则禁止进入 design 生成。若未启用 D2C，按常规 spec → design 流程继续
      - 进入 design 后，D2C 产物只作为视觉与交互基线参考，实现质量优先于 D2C 代码复用率

      说明：design.md 是 tasks 和 apply 的前置依赖，必须完成后才能进入实施阶段。

      ## 核心原则

      1. **Fact-Based and MCP-First**: 设计中的每一个字段、组件引用，必须有 PRD 原文、MCP 查询结果或现有代码作为依据。严禁幻觉。
      2. **Contract-First**: 涉及的每一个后端接口，必须先调用 `mcp__contract-doc__get_contract_doc`。未获取契约禁止设计。
      3. **Standards-Compliant**: {{DEVELOP_SKILLS_RULE_LINE}}
      4. **Task-Tracked**: 使用 TaskCreate/TaskUpdate/TaskList 追踪每个步骤。
      5. **Readable Output**: 文档先摘要后细节，技术流程图直接写入 design.md。
      6. **Artifact Boundary**: 仅产出 `design.md`，严禁生成或承诺 `tasks.md`。
      7. **Implementation Quality First**: 若 D2C 产物组件使用不正确，基于组件库知识和跨端规范重新定稿；禁止为复用 D2C 代码而牺牲实现质量。
      8. **Baseline vs Implementation**: D2C 产物提供视觉结构和交互参考，最终组件选型和工程组织以 design.md 为准。

      ## 阶段识别

      - **设计生成阶段**: design.md 不存在 → 执行 D-1-1 ~ D-6-3
      - **设计评审阶段**: design.md 已存在 → 基于用户反馈执行 D-4-R{n}-1 ~ D-6-3
      - 评审阶段：用户补充的技术信息需通过 MCP/Skill 重新验证；若引入全新接口集合或大范围变化，回到 D-1-3 重新收集事实

      ## 执行流程概览

      ### 阶段0：入口任务预建
      - 生成路径：预建 `D-1-1~D-3`、`D-5-1`、`D-6-1~D-6-3`
      - 评审路径：仅创建本轮 `D-4-R{n}-1~D-4-R{n}-3`

      ### 阶段一：技术事实收集
      - D-1-1: 技术框架概览
      - D-1-2: 开发规范查询
      - D-1-3: spec 需求解析
      - D-1-4: 代码库最佳实践探索（双路并行）
      - D-1-5: 基建能力查询与验证
      - D-2: 后端接口契约查询（Contract-First）
      - D-3: 差距分析与问题生成
      - D-3 完成后仅生成问题列表，不输出文档

      ### 阶段二：技术问题讨论（与用户交互）
      按轮次循环执行 D-4-R{n}-1（问题展示）→ D-4-R{n}-2（接收答复+事实核对）→ D-4-R{n}-3（复盘与新问题检测）

      ### 阶段三：技术流程图内部生成
      - D-5-1: 生成并校验 Mermaid 技术实现流程图
      - **阶段切换门禁**：未解决问题数和待确认项数均为 0

      ### 阶段四：文档生成与交付
      - D-6-1: 生成完整 design.md（若仍存在任何未解决技术问题，MUST 立即停止并回到阶段二调用 AskUserQuestion）
      - D-6-2: 格式与内容质量审查（format-compliance-agent）
      - D-6-3: 交付通知（`<spec-notification artifact=”design” .../>` 标签）

    requires:
      - spec

  - id: tasks
    generates: tasks.md
    description: 基于架构师思维的任务规划
    template: tasks.md
    instruction: |
      使用架构师思维生成任务列表。

      MUST 使用 task-planning skill 进行任务规划。

      ### 任务追踪系统规则（CRITICAL）

      **通用任务管理规则：**
      1. **任务创建**：进入 tasks artifact 时 MUST 一次性预建固定骨架任务 T-1~T-6
      2. **任务更新**：
         - 开始处理任务时：TaskUpdate 设为 in_progress
         - 完成任务时：TaskUpdate 设为 completed
      3. **任务查询**：任何任务开始前，MUST 调用 TaskList 确认当前状态
      4. **失败处理**：任务执行失败时，保持 in_progress 状态，停止后续任务

      ### 阶段0：入口固定骨架任务预建（内部）
      **MUST 在进入 tasks artifact 后立即执行 (BLOCKING):**
      调用 TaskCreate 一次性预建固定骨架任务：
      - `T-1`、`T-2`、`T-3`、`T-4`、`T-5`、`T-6`

      **执行规则（阶段0）:**
      1. 先调用 TaskList 检查固定骨架任务是否已存在
      2. 若缺失，立即补建缺失任务；若已存在，不重复创建
      3. 预建完成后按顺序执行 T-1

      ### 任务定义

      **Task T-1: 读取 design.md 和 spec.md**
      - Subject: "T-1: 读取 design.md 和 spec.md"
      - Description: "读取 spec.md 和 design.md；提取需求逻辑（功能点清单、Scope 边界）、技术方案（方案摘要、代码变更地图、核心实现要点）、接口契约清单；确认 design.md 中'关键数据源与契约'已齐备（无 MISSING 标记）；若存在 MISSING 标记，MUST 停止并提示用户先回到 design 阶段补充"
      - ActiveForm: "正在读取 design.md 和 spec.md"

      **Task T-2: D2C 条件检查（条件执行）**
      - Subject: "T-2: D2C 条件检查"
      - Description: "【条件执行】若 spec.md 中 `D2C_ENABLED=true` 且 `D2C_BASELINE_FROZEN=true`，MUST 执行以下步骤：(a) 读取 `openspec/changes/<change-id>/d2c/manifest.json`，提取 `materials[]` 数组（每条 material 包含 `artifactId`、`scope`、`description`）；(b) 读取 design.md 的'UI 基线与实现载体约束'章节，提取'需要替换的 D2C 节点/组件'清单；(c) 基于 manifest materials 和 design 实现载体重定稿，识别 D2C 覆盖的页面/组件，确定哪些需要 carrier-fix（design 标记需替换组件的）、哪些仅需 logic-injection（组件载体正确仅需补逻辑的）；【跳过条件】若未启用 D2C 或基线未冻结，直接标记 T-2 为 completed 并进入 T-3"
      - ActiveForm: "正在检查 D2C 条件"

      **Task T-3: 任务拆解**
      - Subject: "T-3: 任务拆解"
      - Description: "调用 task-planning skill 执行任务规划；基于 T-1 提取的需求逻辑和技术方案、T-2 的 D2C 分类结果（若有），按下方'架构师思维'和'任务格式'要求生成 tasks.md"
      - ActiveForm: "正在拆解任务"

      **Task T-4: 自检清单**
      - Subject: "T-4: 自检清单"
      - Description: "基于 T-3 调用 task-planning skill 时获取的自检清单（9 项），逐条核对 tasks.md 内容；若发现不合格项，MUST 回到 T-3 修正后重新自检"
      - ActiveForm: "正在执行自检清单"

      **Task T-5: 格式审查**
      - Subject: "T-5: 格式审查"
      - Description: "使用 Agent 工具启动 format-compliance-agent 进行格式合规审查；传入 tasks.md 的模板路径和当前 change 的 tasks.md 文档路径；若审查不通过，MUST 修正后重新审查"
      - ActiveForm: "正在进行格式审查"

      **Task T-6: 交付通知**
      - Subject: "T-6: 交付通知"
      - Description: "【最终响应结构（CRITICAL）】最终响应 MUST 严格遵循以下结构：(1)简短总结（1-2句话概括任务规划要点），(2)`<spec-notification artifact=\"tasks\" changeId=\"actual-change-id\" title=\"任务清单已生成\" description=\"点击查看完整 tasks.md 文档\" />` 标签作为响应的**最后一个元素**；【强制约束（BLOCKING）】`changeId` MUST 使用当前 change 的真实 ID，严禁使用 `your-change-id`、留空或占位值；通知标签 MUST 是响应的最后一个元素，标签之后不得有任何文字、提示或空行；严禁在标签后添加任何形式的'下一步提示'（如 `opsx:continue`、'请继续'、'进入下一阶段'、'可以开始实施'等）；【验收标准（MUST）】若最终响应缺少该标签、标签数量不为 1、`artifact` 不是 `tasks`、`changeId` 不是当前真实 changeId、title/description 缺失、或标签后存在额外内容，则 T-6 视为未完成，禁止宣称 tasks 已生成、禁止将 T-6 标记为 completed"
      - ActiveForm: "正在输出交付通知"

      ### 执行规则
      1. 任务依赖链：T-1 → T-2 → T-3 → T-4 → T-5 → T-6（严格按此顺序执行）
      2. tasks.md 不得承载待决策问题、待确认事项或建议用户确认；若 design 尚有未收口问题，MUST 在 T-1 阶段停止并提示用户回到 design 阶段

      ---

      **架构师思维 (IMPORTANT):**
      1.  **任务边界划分 (Context-Closed)**:
          - 每个任务必须是**完整的工作单元**（例如："实现登录页 UI +逻辑"），任务规模应控制在单次 session 内完成。
          - **禁止**生成"测试"任务（如果用户明确要求需要测试，测试包含在具体开发任务中）。
      2.  **D2C 任务分类（条件）**: 若启用 D2C，前端任务必须分为两类：`实现载体修正`（carrier-fix）与 `业务逻辑接入`（logic-injection）；允许按 design 将 D2C 中不正确的组件实现替换为正确组件库/跨端组件；禁止脱离 design 擅自重做 UI 或推翻视觉交互基线。

      **IMPORTANT**: 请严格遵循下方模板格式，apply 阶段将解析。
      复选框格式以追踪进度，未使用`- [ ]`的任务将无法被追踪。

      输出结构（MUST）：
      - `Plan 摘要`（目标/范围/执行策略）
      - `文件变更地图`（使用 `[NEW]/[MODIFY]/[DELETE]` 标签）
      - `执行任务`（复选框）
      - `验证计划`（自动化验证 + 手动验证）

      任务格式（MUST）：
      - 每个任务必须采用复选框格式：`- [ ] X.Y [TAG] 任务描述`
      - 每个任务必须包含：`Goal`、`Writes`、`Depends On`、`Done When`
      - 按依赖关系排序；可并行任务需明确无 writes 冲突
      - 禁止独立测试任务（除非用户明确要求）
      - 若启用 D2C，前端任务的 `Writes` MUST 明确标出哪些文件是"实现载体修正"（`[carrier-fix]`），哪些文件是"逻辑接入"（`[logic-injection]`）；不得笼统写成"重写页面"
      - 若启用 D2C，涉及 D2C 缝合的任务 MUST 在 Goal 中引用对应的 D2C 产物基线路径：`openspec/changes/<change-id>/d2c/<artifactId>/index.tsx`
      - 若启用 D2C，`Done When` MUST 同时覆盖：视觉交互基线保持一致、最终组件实现符合 design 中的组件库/跨端约束

      **任务解析规则 (IMPORTANT)**:
      - 仅 `## 执行任务` 章节下且匹配 `- [ ] X.Y [TAG] 任务描述` 的条目是可执行任务
      - 其他章节（如 `验证计划`）的复选框仅为检查清单，不参与任务追踪

      深入理解 design.md 中的技术实现方案，任务必须可验证且可在单次 session 内完成。
    requires:
      - design

apply:
  requires: [tasks, design]
  tracks: tasks.md
  instruction: |
    动手前先阅读 design.md，再按 tasks.md 逐项实现并勾选完成状态。

    MUST 使用以下 skills 辅助实现：
    {{DEVELOP_SKILLS_APPLY_ITEM}}
    {{QUERYING_INFRA_APPLY_ITEM}}

    **实现原则:**
    - **Strict Mode**: 如果发现代码中需要调用的 API 在 `design.md` 中缺失或不匹配，**必须暂停**并重新调研（调用 MCP），严禁盲目编码。
    - **Verify**: 阅读上下文文件，按待办任务推进，完成即标记。
    - **Implementation Source of Truth**: 若启用 D2C，`design.md` 才是最终工程实现真源；D2C 产物仅作为视觉与交互基线参考，禁止直接把 D2C 代码视为正确组件实现。
    - **D2C Replace Rules**: 若启用 D2C，允许按 `design.md` 将 `mockData` 替换为真实数据流、将占位事件替换为真实业务处理、将不正确的 D2C 组件替换为正确组件库/跨端组件；前提是视觉结构、交互路径和场景闭环保持与 UI 基线一致。
    - **D2C Stop Rules**: 若实施过程中发现必须脱离 `design.md` 才能修改 UI 基线、重写布局骨架、变更节点层级或推翻交互路径，MUST 停止实施并回退到 design 重新确认；严禁在 apply 阶段擅自推翻基线。
    - **D2C Verification**: 若启用 D2C，完成实现后必须额外自检：视觉结构未偏离基线、交互路径未偏离基线、最终组件实现符合 design 中的组件库/跨端约束。
    - <apply-reminder>所有实施任务完成之后，MUST 使用 Agent 工具启动 quality-gate-agent 来审查代码实施是否符合设计和规范。</apply-reminder>
