      ### 阶段二：技术问题讨论（与用户交互）

      **MUST 在开始前创建任务列表 (BLOCKING):**
      使用 TaskCreate 工具创建以下 3 个任务。

      **任务定义：**

      **Task D-4-1: 问题展示**
      - Subject: "D-4-1: 问题展示"
      - Description: "【执行指令】(1)检查迭代计数器：本次是第N轮（阶段二+阶段三合计，从阶段三回退到阶段二时计数器继续累加不重置），若N≥5且仍有🔴临界问题，执行步骤(2)，否则跳到步骤(3)；(2)达到5轮上限处理：停止迭代，展示'已完成5轮迭代，仍有X个🔴临界技术问题未解决'，询问用户选择：[继续5轮/暂停重新梳理需求/忽略问题强制进入下阶段]，等待用户选择，根据选择重置计数器（继续5轮）或进入下阶段（其他选项）；(3)正常展示：将所有技术设计问题展示给用户，每个问题提供1-2个技术方案（基于D-1-2开发规范、D-1-4最佳实践），标注优先级（🔴/🟡/🟢）和技术背景，等待用户回答；【绝对上限】无论用户如何选择，总迭代次数（包括所有重置后的轮次）不得超过10轮，超过10轮后强制终止流程，生成包含所有未解决技术问题的 blocker 级别报告，要求用户补充技术信息或手动解决"
      - ActiveForm: "正在展示技术问题"

      **Task D-4-2: 接收用户答复**
      - Subject: "D-4-2: 接收用户答复"
      - Description: "【执行指令】(1)接收答复：记录用户在问题列表中的每一个技术选择或自定义方案；(2)完整性检查：确保所有🔴临界问题已得到回答，若有未答复的🔴问题，标记为'待补充'并在下一轮提醒；(3)质量检查：检测模糊答复（如'随便'、'都行'、'看情况'、空答复、仅回复标点符号），对模糊答复生成追问：'该技术决策涉及[具体影响]，请明确选择：[方案A] 或 [方案B]，或提供具体技术要求'；(4)事实核对：**对用户提及的技术信息进行事实核对**：后端接口（重新调用 mcp__contract-doc__get_contract_doc）、基建组件（调用 querying-infra-catalog skill）、开发规范（重新读取相关 skill）、代码实现（使用 Glob/Grep 验证）；每项信息标注验证结果和事实来源标记（[MCP:契约]/[MCP:基建]/[Skill]/[代码库]/[用户确认]）；(5)记录结果：将明确且已验证的答复记录到问题列表，将模糊答复标记为'需追问'，在 D-4-3 中处理"
      - ActiveForm: "正在接收并验证用户答复"

      **Task D-4-3: 复盘与新问题检测 (CRITICAL!)**
      - Subject: "D-4-3: 复盘与新问题检测"
      - Description: "**复盘所有已知信息（proposal.md + 技术事实 + 用户答复）**；检查用户答复是否引入新的技术歧义或实现漏洞；检查答复之间是否存在技术方案冲突或不一致；检查是否有技术细节空缺未被覆盖（如接口字段缺失、组件能力不足、异常处理缺漏）；检查用户提及的技术方案是否与 D-1-2 开发规范冲突；**若发现新问题**：生成新的问题条目，回到 D-4-1 继续讨论；**若无新问题**：标记所有问题为已解决，进入阶段三"
      - ActiveForm: "正在复盘并检测新问题"

      **执行规则（阶段二）:**
      1. 开始评审前，先使用 TaskList 检查是否存在上一轮的任务
      2. 若存在，将上一轮任务状态设为 deleted（避免混淆）
      3. 调用 TaskCreate 创建本轮的 D-4-1~D-4-3 任务
      4. **循环执行 D-4-1 → D-4-2 → D-4-3**：
         - 若 D-4-3 发现新问题 → 回到 D-4-1 展示新问题
         - 若 D-4-3 确认无新问题 → 进入阶段三
      5. 所有任务完成后，调用 TaskList 确认全部标记为 completed

      **复盘检查清单（D-4-3 专用）:**

      按严重程度分级判断，仅🔴级别问题触发回退：

      **🔴 必须回退（影响技术实现的可行性）：**
      - [ ] 用户答复引入新的技术实现分支，但**缺少关键技术信息**
        - 回退示例：用户说"支付成功后发短信"，但短信API（serviceCode/operationName）未查询
        - 非回退：用户说"按钮点击要有Loading" - 常规交互，实现时处理即可
      - [ ] 不同问题的技术方案答复之间存在**无法共存的冲突**
        - 回退示例：Q1说用localStorage存token，Q3说用sessionStorage，但代码只能选一个
        - 非回退：前端用TypeScript类型，后端用JSON Schema - 不是冲突，是不同层面
      - [ ] **核心业务字段**来源仍是 L3（⚠️未明确）
        - 回退示例：订单ID、用户ID、支付金额等关键字段仍无法确定来源
        - 非回退：辅助字段（昵称、头像）是L3，但有默认值或可为空
      - [ ] 基建组件的能力范围**无法覆盖核心需求**
        - 回退示例：需要上传视频，但MCP查询显示只支持图片 - 能力缺失
        - 非回退：组件缺少某个props，但可通过外层包装解决
      - [ ] 用户提及的技术方案**严重违反开发规范**
        - 回退示例：用户要求用jQuery，但规范强制使用React - 无法执行
        - 非回退：用户建议用某种命名风格，与规范略有差异 - 可协商

      **🟡 建议确认（不影响核心技术方案，可在SYSTEM_SUGGESTION中说明）：**
      - [ ] 用户答复引入新的异常流程或错误处理，但有标准处理方式
        - 示例：用户要求"接口超时要提示" - 可使用标准错误处理机制
      - [ ] **次要字段**来源是 L3，但不影响主流程
        - 示例：推荐理由、标签颜色等辅助信息
      - [ ] 数据流向有细微不明确，但逻辑可推断
        - 示例：某个中间变量的转换逻辑不明确，但从输入输出可推断

      **🟢 记录即可（优化建议，不回退）：**
      - [ ] 代码组织、命名风格、注释规范等
      - [ ] 性能优化建议（如防抖节流）
      - [ ] 可访问性、SEO等非核心需求

      **回退判定规则：**
      - 发现任何🔴级别问题 → MUST 回退到 D-4-1
      - 仅存在🟡级别 → 在 SYSTEM_SUGGESTION 中补充说明，继续进入阶段三
      - 仅存在🟢级别 → 记录在变更日志，继续进入阶段三

