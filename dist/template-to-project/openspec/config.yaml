schema: specforge-enhanced

context: |
  格式合规审查 (IMPORTANT):
  - 调用时机：仅在阶段四文档生成完成后调用，阶段二问题讨论和阶段三内部流程图生成过程中不调用（文档仍在变化中）
  - 每个 artifact（spec/design/tasks）在阶段四生成完成后，MUST 使用 Agent 工具启动 format-compliance-agent 进行格式合规审查
  - format-compliance-agent 职责：读取对应模板文件 → 对比生成文档的结构 → 修复结构偏差 → 严禁删除信息
    - 若发现待决策点散落在文档其他章节、章节顺序与模板不一致、必需章节缺失等问题，必须修复
    - 具体调用时机：
      - spec: 由 P-4-2 执行（P-4-1 生成文档完成后）
      - design: 由 D-6-2 执行（D-6-1 生成文档完成后）
      - tasks: 由 T-5 执行（T-3 生成 tasks.md 完成后）

rules:
  spec:
    - MUST 若阶段四 mcp__mermaid-mcp__mermaidTool 可用且校验通过，文档不得保留"⚠️ 未经 MCP 验证"提示
    - MUST 当前 artifact 为 spec 时禁止在本阶段生成或讨论 design.md/tasks.md
    - MUST 以 `<spec-notification artifact="spec" .../>` 标签作为最终响应的最后一个元素，标签后不得有任何文字

  design:
    - MUST 若阶段四 mcp__mermaid-mcp__mermaidTool 可用且校验通过，文档不得保留"⚠️ 未经 MCP 验证"提示
    - MUST 当前 artifact 为 design 时仅允许产出/讨论 design.md；禁止在本阶段生成或承诺生成 tasks.md
    # Fact-Based Development
    - 每个字段、组件引用必须有事实依据（PRD原文/MCP查询结果/现有代码实现）
    - 严禁编造 pageId、serviceCode、组件名或参数
    - pageId、serviceCode/operationName、路由URL、资源位ID、鉴权source 等属于实施阻塞固定配置；无证据时必须进入待用户确认项
    - 查不到的内容标记为 MISSING
    # Contract-First
    - 后端接口必须先调用契约查询
    - 入参表必须包含：字段路径、类型、必填、来源、示例值、置信度
    - 返回值表必须完整展开嵌套结构
    - MUST 清零置信度列中的未解决项（如 ⚠️ 未解决 / ⚠️ L3未明确）
    # Problem Generation
    - L2 字段默认不生成问题；但涉及待用户确认项（如固定值证据不足、来源不明、产品待提供）时 MUST 进入 D-4 与用户确认
    - 实施阻塞固定配置项（如 pageId、serviceCode/operationName、路由URL、资源位ID、鉴权source）若未确认，MUST 作为🔴问题在 D-4 批量向用户确认
    - 问题按功能块聚类，禁止碎片化提问
    - 只要存在待用户确认项（不区分🔴/🟡），MUST 先完成至少一轮 D-4 后才能进入 D-5/D-6
    - 用户最终确认前，待确认事项（实施前）中的阻塞项必须为 0；否则禁止完成 design
    - MUST 以 `<spec-notification artifact="design" .../>` 标签作为最终响应的最后一个元素，标签后不得有任何文字

  tasks:
    - MUST tasks 门禁场景中 Mermaid 校验记为 N/A（无 mermaid 代码块时不调用 mcp__mermaid-mcp__mermaidTool）
    - MUST 以 `<spec-notification artifact="tasks" .../>` 标签作为最终响应的最后一个元素，标签后不得有任何文字
